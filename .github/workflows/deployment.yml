name: Deploy Project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install nodejs
        uses: actions/setup-node@v7
        with: 
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run test 
        run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7
      - name: Install nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Build the Project
        run: npm run build
      - name: Deploy
        run: echo 'Deploying ...'
         
